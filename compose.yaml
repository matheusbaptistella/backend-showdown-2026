services:
  nginx:
    image: nginx:1.31.1-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    ports:
      - "9999:9999"
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "32MB"

  api1: &api
    build:
      context: .
      target: final
    hostname: api1
    expose:
      - 3000
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "159MB"

  api2:
    <<: *api
    hostname: api2

networks:
  backend:
    driver: bridge
