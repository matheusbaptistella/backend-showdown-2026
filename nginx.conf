worker_processes 1;

events {
    worker_connections 1024;
    use epoll;
    multi_accept off;
}

http {
    access_log off;
    error_log /dev/null emerg;

    sendfile off;
    tcp_nopush off;
    tcp_nodelay on;

    keepalive_timeout 300s;
    keepalive_requests 100000;
    keepalive_time 1h;

    gzip off;

    upstream api {
        server api1:3000;
        server api2:3000;
        keepalive 256;
    }

    server {
        listen 9999;

        location / {
            proxy_http_version 1.1;

            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_set_header Keep-Alive "";
            proxy_set_header Proxy-Connection "keep-alive";
            proxy_pass http://api;
        }
    }
}
